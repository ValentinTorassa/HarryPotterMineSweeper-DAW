<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Buscaminas Harry Potter</title>
    <link rel="icon" type="image/png" href="img/hatIcon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contactStyles.css">
</head>
<body>
    <header class="header">
        <h1 class="header-title">Buscaminas Harry Potter</h1>
        <div class="header-actions">
            <a href="index.html" class="header-link">Volver al Juego</a>
            <a href="https://github.com/ValentinTorassa/MineSweeper-DAW" class="header-link" target="_blank">GitHub</a>
            <div class="mode-toggle">
                <button id="toggleModeBtn" class="mode-btn" aria-label="Cambiar modo" title="Cambiar modo claro/oscuro">🌙</button>
                <button id="musicToggleBtn" class="mode-btn" aria-label="Música" title="Prender/Apagar música">🔈</button>
            </div>
        </div>
    </header>
    <main class="main">
        <form id="formContact" class="formContact">
            <label for="nameContact">🧙‍♂️ Nombre del Mago:</label>
            <input type="text" id="nameContact" name="nameContact" placeholder="Ingresa tu nombre mágico">
            <span id="errorNameContact" class="error"></span>
        
            <label for="emailContact">📮 Lechuza Postal (Email):</label>
            <input type="email" id="emailContact" name="emailContact" placeholder="tu.email@hogwarts.com">
            <span id="errorEmailContact" class="error"></span>
        
            <label for="messageContact">📜 Mensaje Mágico:</label>
            <textarea id="messageContact" name="messageContact" placeholder="Escribe tu mensaje aquí..."></textarea>
            <span id="errorMessageContact" class="error"></span>
        
            <label for="houseContact">🏰 Selecciona tu Casa de Hogwarts:</label>
            <select id="houseContact" name="houseContact">
                <option value="">🎭 Elige tu casa...</option>
                <option value="Gryffindor">🦁 Gryffindor</option>
                <option value="Slytherin">🐍 Slytherin</option>
                <option value="Ravenclaw">🦅 Ravenclaw</option>
                <option value="Hufflepuff">🦡 Hufflepuff</option>
            </select>
            <span id="errorHouseContact" class="error"></span>
        
            <button type="submit">✨ Enviar Hechizo</button>
        </form>
        
    </main>
    <div id="modalContact" class="modal">
        <div class="modalContent">
            <p id="modalMessage"></p>
            <button id="closeModalButton" type="button">Close</button>
        </div>
    </div>
    <script src="js/contactScript.js"></script>
    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
